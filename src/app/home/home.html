<div class="container color-dark">
  <div class="col">
    <p>Un élément de liste</p>
  </div>
  <div class="col">
    <p>Ma liste d'éléments ({{ nbItems }})</p>
  </div>
</div>

<div class="container color-light">
  <div class="col">
    <p class="sm">Un nouvel élément de liste</p>
  </div>
  <div class="col">
    @for (objectif of activiteService.objectifs; track $index) {
      <button type="button" class="life-container" animate.enter="fade-in" (click)="consulter($index)">
        {{ objectif }}
      </button>
    }
  </div>
  <div class="col">
    <input type="text" class="txt" name="objectif" placeholder="Nouvelle activité" [(ngModel)]="objectifText">
    <input type="submit" class="btn" name="tkt" [value]="btnText" (click)="ajoutItem()">
  </div>
</div>
